<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Flag Guesser — Choices</title>
  <meta name="description" content="Guess the flag from four options." />

  <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png?v=20260901" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg?v=20260901" />
  <link rel="shortcut icon" href="/favicon/favicon.ico?v=20260901" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="chart-texture" aria-hidden="true"></div>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">Flag <span>Guesser</span></h1>
    <p class="tagline">Pick the correct flag from four options.</p>
    <nav class="game-nav">
      <a href="index.html" class="game-nav-link">Tiles</a>
      <a href="colors.html" class="game-nav-link">Colours</a>
      <span class="game-nav-link is-active">Choices</span>
    </nav>
  </div>
</header>

<main class="stage">

  <section class="board-wrap">
    <div class="board-frame">
      <div class="board board--choices" id="board">
        <div class="flag-layer" id="flag-layer"></div>
      </div>
    </div>

    <div class="board-caption">
      <span class="score-tally"><strong id="round-score">0</strong> correct · <strong id="round-total">0</strong> played</span>
    </div>
  </section>

  <section class="control-deck">
    <div class="choice-grid" id="choice-grid"></div>
  </section>

</main>

<div class="toast" id="toast" role="status" aria-live="assertive">
  <p class="toast-message" id="toast-message"></p>
  <button type="button" class="btn-newgame" id="next-btn" hidden>New Game</button>
</div>

<script src="flags-manifest.js"></script>
<script src="choices-game.js"></script>
</body>
</html>
